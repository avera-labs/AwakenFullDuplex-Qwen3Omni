<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two lanes on one clock, as in Figure 1: the user (top) speaks, pauses, speaks;
       the agent (bottom) backchannels during the first stretch and replies after the second. -->
  <rect width="64" height="64" rx="14" fill="#1e293b"/>
  <rect x="9" y="15" width="26" height="12" rx="6" fill="#56B4E9"/>
  <rect x="39" y="15" width="9" height="12" rx="6" fill="#56B4E9"/>
  <rect x="20" y="37" width="9" height="12" rx="6" fill="#E69F00"/>
  <rect x="35" y="37" width="20" height="12" rx="6" fill="#E8692A"/>
</svg>
